openapi: 3.0.0
info:
  version: '0.1.0'
  title: mlsolid REST API
  description: REST API allowing users to interact with mlsolid.

paths:
  /login/{provider}:
  /logout:
  /authorize:
    get:
      description: genereate API key for gRPC endpoints
      responses:
        200:
          description: API generated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - api-key
                properties:
                  api-key:
                    type: string
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /authorized:
    get:
      description: check if user is authorized
      responses:
        200:
          content:
            application/json:
              schema:
                type: object
                required:
                  - authorized
                properties:
                  authorized:
                    type: boolean
        401:
          content:
            application/json:
              schema:
                type: object
                required:
                  - authorized
                properties:
                  authorized:
                    type: boolean
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/exps:
    get:
      description: retrieve all experiment with a list of their runs.
      responses:
        200:
          description: successfully retrieved experiments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentsResponse'
        500:
          description: could not retrieve experiments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/exp/{id}:
    get:
      description: retrieve runs and metrics linked to an experiment
      parameters:
        - name: id
          in: path
          description: id of the experiment
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved experiment successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResponse'
        404:
          description: could not find experiment runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve experiment data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/exp/{id}/metrics:
    get:
      description: retrieve metrics linked to an experiment
      parameters:
        - name: id
          in: path
          description: id of the experiment
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved metrics successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentMetricsResponse'
        500:
          description: could not retrieve metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/exp/{id}/metric/{mid}:
    get:
      description: retrieve a metric from an experiment
      parameters:
        - name: id
          in: path
          description: id of the experiment
          required: true
          schema:
            type: string
        - name: mid
          in: path
          description: id of the metric
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved metric successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentMetricResponse'
        404:
          description: could not find metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve metric
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/exp/{id}/artifacts:
    get:
      description: retrieve all artifact ids for each run in the experiment
      parameters:
        - name: id
          in: path
          description: id of the experiment
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved artifacts successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentArtifactsResponse'
        404:
          description: could not find resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/artifact/{rid}/{aid}:
    get:
      description: retrieve an artifact with a runId and an artifactId
      parameters:
        - name: rid
          in: path
          description: id of the run
          required: true
          schema:
            type: string
        - name: aid
          in: path
          description: id of the artifact
          required: true
          schema:
            type: string
      responses:
        200:
          description: requested artifact file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: could not find resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registries:
    get:
      description: retrieve all registry names
      responses:
        200:
          description: retrieved registries successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistriesResponse'
        500:
          description: could not retrieve resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry:
    post:
      description: create a new model registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistryRequest'
      responses:
        201:
          description: model registry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRegistryResponse'
        400:
          description: could not create model registry due to bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/registry/{id}:
    get:
      description: retrieve a model registry
      parameters:
        - name: id
          in: path
          description: id of the model registry
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved model registry successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryResponse'
        404:
          description: could not find resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        
  /v1/benchmarks:
    get:
      description: retrieve list of benchmarks
      responses:
        200:
          description: retrieved benchmarks successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarksResponse'
        500:
          description: could not retrieve artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/benchmark:
    post:
      description: create a new benchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBenchmarkRequest'
      responses:
        201:
          description: benchmark created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBenchmarkResponse'
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/benchmark/{id}:
    get:
      description: get benchmark by id
      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      responses:
        200:
          description: retrieved benchmark successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkResponse'
        404:
          description: could not find benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not retrieve benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      description: update benchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBenchmarkRequest'

      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      responses:
        200:
          description: benchmark updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateBenchmarkResponse'
        400:
          description: bad benchmark update request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: could not find benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not update benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      description: delete benchmark
      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      responses:
        200:
          description: benchmark deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBenchmarkResponse'
        500:
          description: could not delete benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        501:
          description: method not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/benchmark/{id}/toggle:
    put:
      description: toggle benchmark pause/unpause
      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      responses:
        200:
          description: benchmark toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkToggleResponse'
        400:
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: benchmark not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not toggle benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/benchmark/{id}/runs:
    get:
      description: retrieve all benchmark runs
      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      responses:
        200:
          description: benchmark runs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunsResponse'
        404:
          description: could not find benchmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: could not fetch benchmark runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/keys:
    get:
      description: retrieve all api key labels
      responses:
        200:
          description: key labels retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyLabelsResponse'
        500:
          description: could not fetch api key labels
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/key:
    post:
      description: create new api key
      parameters:
        - name: label
          in: query
          description: api key label
          required: true
          schema:
            type: string
      responses:
        201:
          description: api key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyResponse'
        500:
          description: could not create api key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        400:
          description: bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/benchmark/{id}/best:
    get:
      description: retrieve best benchmark runs
      parameters:
        - name: id
          in: path
          description: benchmark id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BestBenchmarkRequest'
      responses:
        200:
          description: best benchmark retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BestBenchmarkResponse'
        400:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


components:
  schemas:
    CreateRegistryRequest:
      type: object
      properties:
        name:
          type: string
        benchmarkImage:
          type: string
        benchmarkGpuPassthrough:
          type: boolean

    CreateBenchmarkRequest:
      type: object
      properties:
        name:
          type: string
          description: Name of the benchmark
        eagerStart:
          type: boolean
          description: Whether to start immediately
        autoTag:
          type: boolean
          description: Automatically tag the benchmark
        tag:
          type: string
          description: Custom tag (if autoTag is true)
        decisionMetric:
          type: string
          description: Metric used for decision making
        registries:
          type: array
          items:
            type: string
          description: List of registry names or IDs
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchMetric'
          description: List of benchmark metrics
        datasetName:
          type: string
          description: Name of the dataset
        datasetURL:
          type: string
          format: uri
          description: URL to the dataset
        datasetFromS3:
          type: boolean
          description: Whether dataset is stored in S3
      required:
        - name
        - registries
        - metrics
        - datasetName
        - datasetURL
        - datasetFromS3

    UpdateBenchmarkRequest:
      type: object
      properties:
        name:
          type: string
          description: New name for the benchmark
        autoTag:
          type: boolean
          nullable: true
          description: Update autotag setting – can be true, false, or null (to clear)
        tag:
          type: string
          description: Update the custom tag
        decisionMetric:
          type: string
          description: Update the decision metric

    BestBenchmarkRequest:
      description: benchmark metrics
      type: array
      items:
        type: string

    ExperimentsResponse:
      type: object
      required:
        - details
        - exps
      properties:
        details:
          type: string
          description: description of successful operation
        exps:
          type: object
          description: Map of experiment ids to list of recorded run ids.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            exp1: ["run#1", "run#2"]
            exp2: ["run#3"]

    ExperimentResponse:
      type: object
      required:
        - details
        - runs
        - metrics
      properties:
        details:
          type: string
          description: description of successfully operation
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunInfo'
          description: array of object with run information
        metrics:
          type: array
          description: array of all run ids linked to the experiment.
          items:
            type: string

    ExperimentMetricsResponse:
      type: object
      required:
        - details
        - metrics
      properties:
        details:
          type: string
          description: description of successfully operation
        metrics:
          type: array
          description: array of all run ids linked to the experiment.
          items:
            type: string

    ExperimentMetricResponse:
      type: object
      required:
        - details
        - metric
        - kind
      properties:
        details:
          type: string
          description: description of successfully operation
        kind:
          type: string
          enum:
            - metric/continuous
            - metric/multival
            - metric/single-numeric
            - metric/single
            - metric/complex
        metric:
          type: object
          description: Map of run id to list of metric vals
          additionalProperties:
            type: array
          example:
            run1: [1, 23, 342, 454]
            run2: ["34", "23", 342.0, 454]
            run3: []
            run4: ["/path/to/smth"]

    ExperimentArtifactsResponse:
      type: object
      required:
        - details
        - artifacts
      properties:
        details:
          type: string
          description: description of successful operation
        artifacts:
          type: object
          description: Map of run id to list of artifact ids
          additionalProperties:
            type: array
            items:
              type: string
          example:
            run1: ["log.txt", "artifact#1"]

    RegistriesResponse:
      type: object
      required:
        - details
        - registries
      properties:
        details:
          type: string
          description: description of successfully operation
        registries:
          type: array
          items:
            type: string

    RegistryResponse:
      type: object
      required:
        - details
        - registry
      properties:
        details:
          type: string
          description: description of successful operation
        registry:
          $ref: '#/components/schemas/Registry'

    CreateRegistryResponse:
      type: object
      required:
        - details
        - id
      properties:
        details:
          type: string
        id:
          type: string

    BenchmarksResponse:
      type: object
      required:
        - details
        - benchmarks
      properties:
        details:
          type: string
          description: description of successfully operation
        benchmarks:
          type: array
          items:
            type: string
          description: array of benchmark ids

    CreateBenchmarkResponse:
      type: object
      required:
        - id
        - created
        - details
      properties:
        id:
          type: string
          description: id of new benchmark
        created:
          type: boolean
          description: true if benchmark was created
        details:
          type: string

    BenchmarkResponse:
      type: object
      required:
        - details
        - benchmark
      properties:
        benchmark:
          $ref: '#/components/schemas/Bench'
        details:
          type: string

    UpdateBenchmarkResponse:
      type: object
      required:
        - details
      properties:
        details:
          type: string 

    DeleteBenchmarkResponse:
      type: object
      required:
        - details
      properties:
        details:
          type: string 

    BenchmarkToggleResponse:
      type: object
      required:
        - details
      properties:
        details:
          type: string

    BenchmarkRunsResponse:
      type: object
      required:
        - details
        - runs
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/BenchRun'
        details:
          type: string

    BestBenchmarkResponse:
      type: object
      required:
        - details
        - runs
      properties:
        details:
          type: string
        runs:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/BenchRun'

    KeyLabelsResponse:
      type: object
      required:
        - details
        - labels
      properties:
        details:
          type: string
        labels:
          type: object
          description: Map of label names to timestamps
          additionalProperties:
            type: string
            format: date-time
            description: Timestamp in RFC3339 format (e.g., 2024-01-01T12:00:00Z)

    KeyResponse:
      type: object
      required:
        - details
        - key
      properties:
        details:
          type: string
        key:
          type: string

    RunInfo:
      type: object
      required:
        - runId
        - createdAt
        - color
      properties:
        runId:
          type: string
          example: "run#234"
        createdAt:
          type: string
          format: date-time
        color:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: details on why operation was unsuccessful

    Registry:
      type: object
      properties:
        details:
          type: string
          description: Registry details
        name:
          type: string
          description: Registry name
        lastVer:
          type: integer
          format: int64
          description: Last version number
        tags:
          type: object
          description: Map of tag names to lists of integer IDs
          additionalProperties:
            type: array
            items:
              type: integer
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        entriesInfo:
          type: object
          description: Map of entry IDs to their information
          additionalProperties:
            $ref: '#/components/schemas/EntryInfo'
        benchmarkImage:
          type: string
          description: docker image for benchmarking
        benchmarkGpuPassthrough:
          type: boolean
          description: enable/disable gpu passthrough when benchmarking
      required:
        - details
        - name
        - lastVer
        - tags
        - createdAt
        - entriesInfo

    EntryInfo:
      type: object
      description: model entry information
      properties:
        createdAt:
          type: string

    Bench:
      type: object
      properties:
        id:
          type: string
          description: Unique benchmark identifier
          example: "bench-123"
        name:
          type: string
          description: Benchmark name
          example: "performance-test-01"
        paused:
          type: boolean
          description: Whether the benchmark is paused
          example: false
        eagerStart:
          type: boolean
          description: Whether to start immediately
          example: true
        autoTag:
          type: boolean
          description: Automatically assign a tag
          example: false
        tag:
          type: string
          description: Custom tag (required)
          example: "nightly-run"
        decisionMetric:
          type: string
          description: Metric used for decision making
          example: "accuracy"
        registries:
          type: array
          items:
            type: string
          description: List of registry names or IDs
          example: ["registry-a", "registry-b"]
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchMetric'
          description: List of benchmark metrics
        datasetName:
          type: string
          description: Name of the dataset
          example: "cifar10"
        datasetUrl:
          type: string
          format: uri
          description: URL to the dataset (must be a valid URL)
          example: "https://example.com/datasets/cifar10"
        fromS3:
          type: boolean
          description: Whether the dataset is stored in S3
          example: true
        timestamp:
          type: string
          format: date-time
          description: Creation or last update timestamp
          example: "2025-05-08T12:34:56Z"
      required:
        - id
        - name
        - tag
        - registries
        - metrics
        - datasetName
        - datasetUrl
        - timestamp

    BenchMetric:
      type: object
      properties:
        name:
          type: string
        descSort:
          type: boolean
      required:
        - name

    BenchRun:
      type: object
      properties:
        registry:
          type: string
          description: Registry name or identifier
          example: "registry-main"
        version:
          type: integer
          format: int64
          description: Version number
          example: 42
        metrics:
          type: object
          description: Map of metric names to float32 values
          additionalProperties:
            type: number
            format: float
          example:
            accuracy: 0.95
            loss: 0.23
        timestamp:
          type: string
          format: date-time
          description: Run timestamp
          example: "2025-05-08T14:30:00Z"
